name: NBA v0.9 prospective evidence
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
    secrets:
      BALLDONTLIE_API_KEY:
        required: true
permissions:
  contents: write
concurrency:
  group: nba-v09-prospective-evidence
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_TRADING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          # Reusable workflow is invoked at a fixed reviewed source SHA.
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check window and durable slot receipt
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from nba_v09_prospective import active
          now = datetime.now(timezone.utc)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('active=' + str(active(now)).lower() + '\n')
              f.write('slot=' + now.strftime('%Y%m%dT%H') + '\n')
          PY
          if git ls-remote --exit-code origin refs/heads/research/nba-v09-evidence > /dev/null; then
            git fetch --depth=1 origin refs/heads/research/nba-v09-evidence:refs/remotes/origin/nba-v09-evidence
            slot=$(sed -n 's/^slot=//p' "$GITHUB_OUTPUT")
            if git cat-file -e "refs/remotes/origin/nba-v09-evidence:research-evidence/slots/$slot"; then
              echo 'duplicate=true' >> "$GITHUB_OUTPUT"
            fi
          else
            code=$?
            if [ "$code" -ne 2 ]; then exit "$code"; fi
          fi
      - name: Offline regression tests
        if: steps.gate.outputs.active == 'true' && steps.gate.outputs.duplicate != 'true'
        run: python -m unittest discover -v
      - name: Collect all provider games and public evidence
        id: capture
        if: steps.gate.outputs.active == 'true' && steps.gate.outputs.duplicate != 'true'
        timeout-minutes: 5
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          SLOT: ${{ steps.gate.outputs.slot }}
        run: python -u nba_v09_prospective.py --output "research-evidence/slots/$SLOT"
      - name: Retain raw and partial evidence artifact
        if: always() && steps.capture.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: nba-v09-prospective-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-evidence/
          retention-days: 90
          if-no-files-found: error
      - name: Append evidence only to isolated durable branch
        if: always() && steps.capture.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_INDEX_FILE: ${{ runner.temp }}/nba-v09-evidence-index
          SLOT: ${{ steps.gate.outputs.slot }}
        shell: bash
        run: |
          set -euo pipefail
          test -d "research-evidence/slots/$SLOT"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          parent=()
          if git show-ref --verify --quiet refs/remotes/origin/nba-v09-evidence; then
            prior=$(git rev-parse refs/remotes/origin/nba-v09-evidence)
            git read-tree "$prior"
            parent=(-p "$prior")
          else
            git read-tree --empty
          fi
          git add -- "research-evidence/slots/$SLOT"
          tree=$(git write-tree)
          commit=$(printf 'Archive v0.9 research evidence %s [skip ci]\n' "$SLOT" | git commit-tree "$tree" "${parent[@]}")
          gh auth setup-git
          # No force, no operational branch target, no checkout/index replacement.
          git push origin "$commit:refs/heads/research/nba-v09-evidence"
