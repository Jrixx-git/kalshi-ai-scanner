name: NBA team challenger history (research only)
on:
  workflow_dispatch:
    inputs:
      season:
        description: BALLDONTLIE season starting year
        required: true
        default: '2025'
        type: string
permissions:
  contents: read
concurrency:
  group: nba-team-history-research
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_TRADING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate offline safeguards
        run: python -m unittest discover -q
      - name: Archive bounded authentic history pages
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          HISTORY_SEASON: ${{ inputs.season }}
        run: python nba_v09_challenger.py --season "$HISTORY_SEASON" --max-pages 20 --history team-history
      - name: Retain raw evidence including incomplete collections
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-team-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: team-history/
          retention-days: 90
          if-no-files-found: warn
