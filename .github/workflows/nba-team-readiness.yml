name: NBA team history readiness (no trades)
on:
  push:
    branches: [develop/paper-trading-v02]
    paths: [research/nba_v09/history-request.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nba-team-readiness
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      LIVE_TRADING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline safeguards
        run: python -m unittest discover -q
      - name: Collect both authentic seasons with actual receipts
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        shell: bash
        run: |
          status=0
          for season in 2025 2026; do
            python nba_v09_challenger.py --season "$season" --max-pages 20 --history team-readiness/team-history || status=1
          done
          exit "$status"
      - name: Verify pages and audit eligibility
        if: always()
        run: python nba_team_readiness.py --history team-readiness/team-history --output team-readiness/readiness.json
      - name: Preserve full and partial raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-team-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: team-readiness/
          retention-days: 90
          if-no-files-found: error
      - name: Append isolated durable evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_INDEX_FILE: ${{ runner.temp }}/team-history-index
        shell: bash
        run: |
          set -euo pipefail
          branch=research/nba-team-history-evidence
          destination="team-history-runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -d team-readiness
          mkdir -p "$destination"
          cp -R team-readiness/. "$destination/"
          parent=()
          if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null; then
            git fetch --depth=1 origin "refs/heads/$branch:refs/remotes/origin/team-history-evidence"
            prior=$(git rev-parse refs/remotes/origin/team-history-evidence)
            git cat-file -e "$prior:$destination" && exit 1
            git read-tree "$prior"
            parent=(-p "$prior")
          else
            code=$?
            test "$code" -eq 2
            git read-tree --empty
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$destination"
          tree=$(git write-tree)
          commit=$(printf 'Archive authentic NBA history %s [skip ci]\n' "$GITHUB_RUN_ID" | git commit-tree "$tree" "${parent[@]}")
          gh auth setup-git
          git push origin "$commit:refs/heads/$branch"
