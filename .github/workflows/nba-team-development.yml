name: NBA bounded development receipts (no trades)
on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      max_wait_seconds:
        type: number
        default: 3600
    secrets:
      BALLDONTLIE_API_KEY:
        required: true
permissions:
  contents: write
concurrency:
  group: nba-team-development-evidence
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    env:
      LIVE_TRADING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline safeguards
        run: python -m unittest discover -q
      - name: Restore immutable research state and authentic baseline archives
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          branch=research/nba-team-development-evidence
          if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null; then
            git fetch --depth=1 origin "refs/heads/$branch:refs/remotes/origin/team-development"
            git archive refs/remotes/origin/team-development | tar -x
          else
            code=$?
            test "$code" -eq 2
          fi
          # Seed only real older receipts, with their original actual timestamps.
          git fetch --depth=1 origin refs/heads/research/nba-team-history-evidence:refs/remotes/origin/team-history
          mkdir prior-history
          git archive refs/remotes/origin/team-history | tar -x -C prior-history
          # Read latest operational archives; never execute mutable source code.
          git fetch --depth=1 origin refs/heads/develop/paper-trading-v02:refs/remotes/origin/latest-develop
          mkdir latest-baseline
          git archive refs/remotes/origin/latest-develop forward_test/state | tar -x -C latest-baseline
          python - <<'PY'
          from pathlib import Path
          from nba_forward_test import immutable
          for p in Path('prior-history/team-history-runs').glob('*/team-history/*/*'):
              if p.is_file():
                  immutable(Path('team-development/team-history')/p.parent.name/p.name, p.read_bytes())
          # Keep an independent research copy; pinned checkout and operational source stay intact.
          for base in (Path('forward_test/state'), Path('latest-baseline/forward_test/state')):
              for p in base.rglob('*'):
                  if p.is_file():
                      immutable(Path('team-development/baseline')/p.relative_to(base), p.read_bytes())
          PY
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from nba_v09_prospective import active
          now = datetime.now(timezone.utc)
          slot = now.strftime('%Y%m%dT%H')
          eligible = active(now) and not (Path('team-development/slots')/slot/'claim.json').exists()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('active='+str(eligible).lower()+'\n')
              f.write('slot='+slot+'\n')
          PY
      - name: Collect and supervise actual future cutoffs
        id: capture
        if: steps.restore.outputs.active == 'true'
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          MAX_WAIT: ${{ inputs.max_wait_seconds }}
        shell: bash
        run: |
          mkdir -p team-development/runs
          python - <<'PY'
          import os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          from nba_forward_test import immutable, encode
          run = os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          immutable(Path('team-development/runs')/(run+'-provenance.json'), encode(dict(
              source_commit=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              baseline_source_commit=subprocess.check_output(['git','rev-parse','refs/remotes/origin/latest-develop'], text=True).strip(),
              run_id=run, observed_at=datetime.now(timezone.utc).isoformat(), no_trade=True)))
          PY
          python -u nba_team_development.py --history team-development/team-history --output team-development --operational team-development/baseline --max-wait-seconds "$MAX_WAIT"
      - name: Verify completed development eligibility without fitting
        if: always() && steps.capture.outcome != 'skipped' && steps.restore.outcome == 'success'
        run: python nba_team_inventory.py --history team-development/team-history --inputs team-development --operational team-development/baseline --output "team-development/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-inventory.json"
      - name: Retain full and partial evidence
        if: always() && steps.capture.outcome != 'skipped' && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: nba-team-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: team-development/
          retention-days: 90
          if-no-files-found: error
      - name: Append durable research state without force pushes
        if: always() && steps.capture.outcome != 'skipped' && steps.restore.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_INDEX_FILE: ${{ runner.temp }}/team-development-index
        shell: bash
        run: |
          set -euo pipefail
          branch=research/nba-team-development-evidence
          parent=()
          if git show-ref --verify --quiet refs/remotes/origin/team-development; then
            prior=$(git rev-parse refs/remotes/origin/team-development)
            git read-tree "$prior"
            parent=(-p "$prior")
          else
            git read-tree --empty
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- team-development
          tree=$(git write-tree)
          commit=$(printf 'Archive prospective development %s [skip ci]\n' "$GITHUB_RUN_ID" | git commit-tree "$tree" "${parent[@]}")
          gh auth setup-git
          git push origin "$commit:refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$commit"
