
name: NBA Multi-Season Backtest

on:
  workflow_dispatch:
    inputs:
      daily_predictions:
        description: 'Run v0.6 daily predictions instead of historical backtest'
        type: boolean
        default: false
      prediction_date:
        description: 'NBA date YYYY-MM-DD (blank = today in New York)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  backtest:
    if: github.ref == 'refs/heads/develop/paper-trading-v02' && !inputs.daily_predictions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download historical NBA games
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          python nba_history.py \
            --seasons 2022 2023 2024 2025 \
            --output nba_history.csv

      - name: Run Elo backtest
        run: |
          python nba_backtest.py \
            --input nba_history.csv \
            --cutoff 2025-10-01

      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: nba-backtest-results
          path: |
            nba_history.csv
            nba_backtest_predictions.csv
          retention-days: 7

  daily-predictions:
    if: github.ref == 'refs/heads/develop/paper-trading-v02' && inputs.daily_predictions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIVE_TRADING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/paper-trading-v02
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest discover -v
      - name: Restore validated NBA history cache
        uses: actions/cache/restore@v4
        with:
          path: .nba_history_cache/
          key: nba-history-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nba-history-v1-${{ github.ref_name }}-
      - name: Daily predictions (GET only)
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          PREDICTION_DATE: ${{ inputs.prediction_date }}
        run: python nba_daily_predictions.py --date "$PREDICTION_DATE" --output-dir daily_predictions
      - name: Save completed history chunks even if retrieval fails
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: .nba_history_cache/
          key: nba-history-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: nba-v06-daily-predictions-${{ github.run_id }}
          path: daily_predictions/
          if-no-files-found: error
          retention-days: 14


