name: SportsDataIO bounded trial audit
on:
  push:
    branches: [research/sportsdataio-trial-2026-10-30]
    paths: ['.github/workflows/sportsdataio-trial.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sportsdataio-trial-audit
  cancel-in-progress: false
jobs:
  trial-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LIVE_TRADING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline credential and provenance tests
        run: python -m unittest research_tests.test_sportsdataio_audit -v
      - name: Verify secret presence and run bounded GET-only audit
        env:
          SPORTSDATAIO_API_KEY: ${{ secrets.SPORTSDATAIO_API_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python -m research_lab.sportsdataio_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sportsdataio-trial-${{ github.run_id }}
          path: research_outputs/sportsdataio_trial/
          retention-days: 30
          if-no-files-found: error
