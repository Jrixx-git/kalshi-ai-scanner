
name: Paper Trading Tests

on:
  push:
    branches:
      - develop/paper-trading-v02
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run risk engine tests
        run: python -m unittest discover -v -p 'test_*.py'
