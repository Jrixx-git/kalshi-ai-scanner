name: NBA v0.9 isolated research
on:
  push:
    branches: [research/nba-v09-asof-2026-11-11]
  workflow_dispatch:
    inputs:
      collect_today:
        description: Collect today's full schedule and public evidence (GET only)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_TRADING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression and adversarial tests
        run: python -m unittest discover -v
      - name: Optional prospective collection
        if: github.event_name == 'workflow_dispatch' && inputs.collect_today
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python nba_v09_collect.py --output v09-validation/prospective
      - name: Full-universe matched audit
        run: python nba_v09_research.py --additional-market-root v09-validation/prospective --output v09-validation/audit.json
      - name: Upload isolated validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-v09-validation-${{ github.run_id }}
          path: v09-validation/
          retention-days: 30
